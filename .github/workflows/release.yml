---
name: Release

run-name: "Release: ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: "📝 Release Please"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "📝 Create or update release PR"
        id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89f09d5d4e4ae1af9f3d7 # v4.2.0
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate-release-pr:
    name: "🔍 Validate Release PR"
    if: needs.release-please.outputs.release_created != 'true'
    needs: [release-please]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: "🔍 YAML Syntax Lint"
        run: pipx run yamllint .

      - name: "🔍 Actions Lint"
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          matcher: true

      - name: "🔍 Validate Galaxy Metadata"
        uses: grzegorzfranus/github-workflows/.github/workflows/ansible-meta-validate.yml@v3.0.1

      - name: "✅ Set Merge Check status"
        if: always()
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          context: "Merge Check Gate"

  publish:
    name: "🚀 Publish to Galaxy"
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please]
    uses: grzegorzfranus/github-workflows/.github/workflows/ansible-publish.yml@v3.0.1
    secrets:
      galaxy-api-key: ${{ secrets.GALAXY_API_KEY }}
