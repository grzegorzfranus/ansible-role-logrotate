---
# =============================================================================
# Ansible Role: Logrotate - Default Variables
# =============================================================================
# This file defines default configuration values for system log rotation.
# These values can be overridden in playbooks or inventory.
#
# Supported OS distributions:
# - Ubuntu 24.04 (Noble) and variants
# - Debian 12 (Bookworm) and variants
#
# Sections:
#   1. General Settings
#   2. Main Logrotate Configuration
#   3. Per-Rule Management
#   4. Role Control
# =============================================================================

# -----------------------------------------------------------------------------
# 1. General Settings
# -----------------------------------------------------------------------------
# Path to logrotate status file used during validation and normal execution runs
# Valid values: absolute file path string starting with /
logrotate_status_file: "/var/lib/logrotate/status"

# Whether this role should manage the main /etc/logrotate.conf configuration file
# Valid values: true, false
logrotate_manage_main_conf: true

# -----------------------------------------------------------------------------
# 2. Main Logrotate Configuration
# -----------------------------------------------------------------------------
# Rotation frequency for global configuration
# Valid values: daily, weekly, monthly
logrotate_frequency: "weekly"

# Number of rotated log archives to keep
# Valid values: integer >= 0
logrotate_rotate: 4

# Whether to compress rotated log files using gzip
# Valid values: true, false
logrotate_compress: false

# User executing rotation scripts via su directive
# Valid values: system user string e.g. "root"
logrotate_su_user: "root"

# Group executing rotation scripts via su directive
# Valid values: system group string e.g. "adm"
logrotate_su_group: "adm"

# Ignore missing log files without issuing errors
# Valid values: true, false
logrotate_missingok: true

# Do not rotate empty log files
# Valid values: true, false
logrotate_notifempty: true

# Use date format suffix for rotated log archives
# Valid values: true, false
logrotate_dateext: false

# Format for date suffix appended to rotated logs when dateext is true
# Valid values: strftime format string e.g. "-%Y%m%d"
logrotate_dateformat: "-%Y%m%d"

# Creation mode and ownership for new log files created after rotation
# Valid values: mode owner group string e.g. "0640 root adm" or empty string ""
logrotate_create: ""

# Automatically create olddir directories for rules that specify olddir option
# Valid values: true, false
logrotate_olddir_create_enabled: true

# Owner user for auto-created olddir directories
# Valid values: system user string e.g. "root"
logrotate_olddir_owner: "root"

# Owner group for auto-created olddir directories
# Valid values: system group string e.g. "root"
logrotate_olddir_group: "root"

# Octal permissions mode for auto-created olddir directories
# Valid values: octal permissions string e.g. "0755"
logrotate_olddir_mode: "0755"

# -----------------------------------------------------------------------------
# 3. Per-Rule Management
# -----------------------------------------------------------------------------
# Define application-specific rules rendered into /etc/logrotate.d/<name>
# Valid values: list of dictionaries conforming to logrotate_rules schema
logrotate_rules:
  # Core system logs (rsyslog-managed)
  - name: rsyslog
    paths:
      - /var/log/syslog
      - /var/log/mail.log
      - /var/log/kern.log
      - /var/log/auth.log
      - /var/log/user.log
      - /var/log/cron.log
    options:
      weekly: true
      rotate: 4
      compress: true
      delaycompress: false
      missingok: true
      notifempty: true
      su: "root syslog"
      sharedscripts: true
      postrotate: |
        /usr/lib/rsyslog/rsyslog-rotate || true
    state: present

  # Login accounting (wtmp)
  - name: wtmp
    paths:
      - /var/log/wtmp
    options:
      monthly: true
      rotate: 1
      create: "0664 root utmp"
      missingok: true
      notifempty: true
      compress: false
    state: present

  # Failed login accounting (btmp)
  - name: btmp
    paths:
      - /var/log/btmp
    options:
      monthly: true
      rotate: 1
      create: "0600 root utmp"
      missingok: true
      notifempty: true
      compress: false
    state: present

  # APT logs
  - name: apt
    paths:
      - /var/log/apt/term.log
      - /var/log/apt/history.log
    options:
      monthly: true
      rotate: 12
      compress: false
      delaycompress: false
      missingok: true
      notifempty: true
      create: "0640 root adm"
    state: present

  # Unattended upgrades logs
  - name: unattended-upgrades
    paths:
      - /var/log/unattended-upgrades/unattended-upgrades.log
      - /var/log/unattended-upgrades/unattended-upgrades-shutdown.log
    options:
      monthly: true
      rotate: 6
      compress: false
      delaycompress: false
      missingok: true
      notifempty: true
      create: "0640 root adm"
    state: present

  # DPKG related logs
  - name: dpkg
    paths:
      - /var/log/dpkg.log
      - /var/log/alternatives.log
    options:
      monthly: true
      rotate: 12
      compress: false
      delaycompress: false
      missingok: true
      notifempty: true
      create: "0640 root adm"
    state: present

# Example structure for custom rules:
# logrotate_rules:
#   - name: nginx                         # Rule filename under /etc/logrotate.d
#     paths:
#       - /var/log/nginx/*.log            # One or more logfile globs/paths
#     options:                            # Optional per-rule overrides
#       rotate: 7                         # Number of archives to keep
#       daily: true                       # Frequency flags: daily/weekly/monthly (choose one)
#       compress: true                    # Compress rotated logs
#       missingok: true                   # Do not fail if missing
#       notifempty: true                  # Skip empty logs
#       create: "0640 www-data adm"       # Create mode and owner:group
#       dateext: true                     # Add date suffix
#       dateformat: ".%Y-%m-%d"           # Date suffix format (requires dateext)
#       copytruncate: false               # Copy+truncate instead of move
#       olddir: "/var/log/nginx/old"      # Move archives to directory
#       sharedscripts: false              # Group script execution
#       prerotate: |
#         /usr/bin/test -x /usr/sbin/nginx && exit 0
#       postrotate: |
#         /usr/bin/systemctl kill -s HUP nginx.service || true
#     state: present                      # present|absent

# -----------------------------------------------------------------------------
# 4. Role Control
# -----------------------------------------------------------------------------
# Control which parts of the role to execute
# Valid values: all, install, configure, logrotate
logrotate_role_action: "all"

# Whether a failed logrotate dry-run verification aborts the role run
# Set to false on hosts with pre-existing third-party rules in /etc/logrotate.d
# that this role does not manage and cannot repair
# Valid values: true, false
logrotate_fail_on_verify_error: true
