---
# =============================================================================
# Ansible Role: Logrotate - Molecule Convergence Playbook
# =============================================================================
# This playbook executes the main role functionality in the test environment.
# It performs the following steps:
# - Updates package repositories
# - Waits for system initialization
# - Applies the logrotate role
#
# The converge connects as a non-root sudoer user (molecule) with become: false.
# This ensures that any role task missing explicit privilege escalation will fail,
# catching the class of bug where per-task become: true is accidentally omitted.
#
# Flow:
# 1. Pre-Tasks Setup (package cache update, systemd readiness)
# 2. Role Execution
# =============================================================================

- name: molecule | Converge
  hosts: all
  gather_facts: true
  remote_user: molecule
  become: false

  vars:
    logrotate_purge_distro_configs:
      - conflicting-distro
    logrotate_rules:
      - name: sample
        paths:
          - /var/log/sample/*.log
        options:
          rotate: 3
          weekly: true
          compress: true
          missingok: true
          notifempty: true
          create: "0640 root adm"
        state: present

  # -----------------------------------------------------------------------------
  # 1. Pre-Tasks Setup
  # -----------------------------------------------------------------------------
  pre_tasks:
    - name: Converge | Verify unprivileged connection user
      ansible.builtin.command: id -un
      register: __logrotate_connection_user
      changed_when: false

    - name: Converge | Assert connecting user is molecule
      ansible.builtin.assert:
        that:
          - __logrotate_connection_user.stdout == 'molecule'
        fail_msg: "Connecting user is '{{ __logrotate_connection_user.stdout }}', expected 'molecule'"

    # Package Cache Update (Debian family)
    - name: Converge | Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      become: true
      changed_when: false
      when: ansible_os_family == 'Debian'

    # Package Cache Update (RedHat family)
    - name: Converge | Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      become: true
      changed_when: false
      when: ansible_os_family == 'RedHat'

    # System Initialization
    - name: Converge | Wait for systemd to complete initialization
      ansible.builtin.command: systemctl is-system-running
      register: __logrotate_systemctl_status
      until: >
        'running' in __logrotate_systemctl_status.stdout or
        'degraded' in __logrotate_systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_service_mgr == 'systemd'
      changed_when: false
      failed_when: __logrotate_systemctl_status.rc > 1

  # -----------------------------------------------------------------------------
  # 2. Role Execution
  # -----------------------------------------------------------------------------
  tasks:
    - name: Converge | Include logrotate role
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
