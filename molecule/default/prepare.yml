---
# =============================================================================
# Ansible Role: Logrotate - Molecule Preparation Playbook
# =============================================================================
# This playbook prepares the test environment before running the role:
# - Fixes critical file permissions
# - Performs basic environment checks
# - Ensures required directories exist
# - Creates a non-root sudoer user for privilege escalation testing
#
# Flow:
# 1. Fix system file permissions
# 2. Validate environment state
# 3. Ensure required directories
# 4. Create artificial conflicting drop-in
# 5. Create non-root sudoer user
# =============================================================================

- name: molecule | Prepare
  hosts: all
  gather_facts: false

  tasks:
    # 1. Fix system file permissions
    # Justification: Use shell module to run multi-command inspection and chmod reset on /etc/shadow.
    - name: Prepare | Fix /etc/shadow permissions
      ansible.builtin.shell:
        cmd: |
          echo "Checking /etc/shadow permissions..."
          ls -l /etc/shadow || true
          chmod 0400 /etc/shadow || true
          echo "Updated /etc/shadow permissions:"
          ls -l /etc/shadow || true
          echo ""
      register: __logrotate_etc_shadow
      changed_when: false

    - name: Prepare | Verify shadow file permissions
      ansible.builtin.debug:
        var: __logrotate_etc_shadow.stdout

    # 2. Validate environment state
    # Justification: Use shell module to inspect binary availability before role execution.
    - name: Prepare | Check logrotate availability
      ansible.builtin.shell:
        cmd: |
          if command -v logrotate >/dev/null 2>&1; then
            echo "logrotate binary is available"
          else
            echo "logrotate not installed yet (expected before role execution)"
          fi
          echo ""
      register: __logrotate_binary_check
      changed_when: false

    - name: Prepare | Show logrotate check results
      ansible.builtin.debug:
        var: __logrotate_binary_check.stdout

    # 3. Ensure required directories
    - name: Prepare | Ensure /etc/logrotate.d directory
      ansible.builtin.file:
        path: /etc/logrotate.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    # 4. Create artificial conflicting distribution drop-in
    - name: Prepare | Create artificial conflicting distribution drop-in
      ansible.builtin.copy:
        dest: /etc/logrotate.d/conflicting-distro
        content: |
          /var/log/sample/*.log {
              weekly
              rotate 4
          }
        mode: "0644"
        owner: root
        group: root

    # 5. Create non-root sudoer user for privilege escalation testing
    # The converge playbook connects as this user with become: false,
    # so any role task that forgets to declare become will fail.
    - name: Prepare | Create molecule test user
      ansible.builtin.user:
        name: molecule
        state: present
        shell: /bin/bash
        create_home: true

    - name: Prepare | Grant molecule user passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/molecule
        content: "molecule ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        owner: root
        group: root
        validate: "visudo -cf %s"
