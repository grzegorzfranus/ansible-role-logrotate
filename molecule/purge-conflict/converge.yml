---
# =============================================================================
# Ansible Role: Logrotate - Molecule Convergence Playbook (Purge Conflict Scenario)
# =============================================================================
# Executes role without logrotate_purge_distro_configs on a host with a conflicting
# drop-in. Expects verification failure in tasks/verify.yml and rescues it.
# =============================================================================

- name: molecule | Converge (Purge Conflict Expected Failure)
  hosts: all
  gather_facts: true

  vars:
    logrotate_purge_distro_configs: []
    logrotate_fail_on_verify_error: true
    logrotate_rules:
      - name: sample
        paths:
          - /var/log/sample/*.log
        options:
          rotate: 3
          weekly: true
          compress: true
          missingok: true
          notifempty: true
          create: "0640 root adm"
        state: present

  pre_tasks:
    - name: Converge | Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      become: true
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: Converge | Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      become: true
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Converge | Wait for systemd to complete initialization
      ansible.builtin.command: systemctl is-system-running
      register: __logrotate_systemctl_status
      until: >
        'running' in __logrotate_systemctl_status.stdout or
        'degraded' in __logrotate_systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_service_mgr == 'systemd'
      changed_when: false
      failed_when: __logrotate_systemctl_status.rc > 1

  tasks:
    - name: Converge | Execute role expecting verify stage failure
      block:
        - name: Converge | Include logrotate role
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
      rescue:
        - name: Converge | Save failure details to file for verify playbook
          become: true
          ansible.builtin.copy:
            dest: /tmp/logrotate_failure_captured.json
            content: >-
              {{ {'task': ansible_failed_task.name | default(''),
                  'msg': ansible_failed_result.msg | default('')} | to_json }}
            mode: "0644"
          changed_when: false

- name: molecule | Converge (Foreign Conflict Expected Warning)
  hosts: all
  gather_facts: true

  vars:
    logrotate_purge_distro_configs: []
    logrotate_fail_on_verify_error: true
    logrotate_fail_on_foreign_verify_error: false
    logrotate_rules: []

  pre_tasks:
    - name: Converge | Clean up previous scenario drop-ins
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/logrotate.d/sample
        - /etc/logrotate.d/conflicting-distro

    - name: Converge | Create two unmanaged conflicting drop-ins
      become: true
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - path: /etc/logrotate.d/foreign-alpha
          content: |
            /var/log/foreign-test/*.log {
                weekly
                rotate 4
                missingok
            }
        - path: /etc/logrotate.d/foreign-beta
          content: |
            /var/log/foreign-test/*.log {
                weekly
                rotate 4
                missingok
            }

  tasks:
    - name: Converge | Include logrotate role expecting success with foreign warning
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."

    - name: Converge | Save foreign result details for verify playbook
      become: true
      ansible.builtin.copy:
        dest: /tmp/logrotate_foreign_captured.json
        content: >-
          {{ {'rc': __logrotate_verify.rc | default(0),
              'stderr': __logrotate_verify.stderr | default('')} | to_json }}
        mode: "0644"
      changed_when: false
