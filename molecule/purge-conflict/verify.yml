---
# =============================================================================
# Ansible Role: Logrotate - Molecule Verification Playbook (Purge Conflict)
# =============================================================================
# Asserts that the role run failed strictly during tasks/verify.yml assertion,
# that the error output extracted lines starting with error:, and that the hint
# regarding logrotate_purge_distro_configs is included in the failure message.
# =============================================================================

- name: molecule | Verify Purge Conflict Failure Scenario
  hosts: all
  gather_facts: false

  tasks:
    - name: Verify | Read captured failure details file
      become: true
      ansible.builtin.slurp:
        src: /tmp/logrotate_failure_captured.json
      register: __logrotate_captured_file

    - name: Verify | Set captured failure facts
      ansible.builtin.set_fact:
        __logrotate_captured_failed_task: "{{ (__logrotate_captured_file.content | b64decode | from_json).task }}"
        __logrotate_captured_failed_msg: "{{ (__logrotate_captured_file.content | b64decode | from_json).msg }}"
        __logrotate_captured_parsed_msg: "{{ ((__logrotate_captured_file.content | b64decode | from_json).msg).split('Full stderr output:')[0] }}"

    - name: Verify | Assert failure originated from verify task instead of template render
      ansible.builtin.assert:
        that:
          - "'verify' in __logrotate_captured_failed_task | lower"
          - "'configure' not in __logrotate_captured_failed_task | lower"
        fail_msg: "Failure originated from wrong task: {{ __logrotate_captured_failed_task }}"
        success_msg: "Failure correctly originated from verify task: {{ __logrotate_captured_failed_task }}"

    - name: Verify | Assert failure message extracts error line
      ansible.builtin.assert:
        that:
          - "'error:' in __logrotate_captured_parsed_msg"
          - "'None extracted' not in __logrotate_captured_parsed_msg"
          - "'duplicate log entry' in __logrotate_captured_parsed_msg"
        fail_msg: "Failure message missing extracted error line or contains 'None extracted': {{ __logrotate_captured_parsed_msg }}"
        success_msg: "Failure message correctly extracts error line without 'None extracted'"

    - name: Verify | Assert failure message contains no literal backslashes
      ansible.builtin.assert:
        that:
          - 'not (__logrotate_captured_failed_msg is search("\\\\"))'
        fail_msg: "Failure message contains literal backslashes: {{ __logrotate_captured_failed_msg }}"
        success_msg: "Failure message contains no literal backslashes"

    - name: Verify | Assert failure message includes logrotate_purge_distro_configs hint
      ansible.builtin.assert:
        that:
          - "'logrotate_purge_distro_configs' in __logrotate_captured_failed_msg"
        fail_msg: "Failure message missing purge variable hint: {{ __logrotate_captured_failed_msg }}"
        success_msg: "Failure message correctly includes logrotate_purge_distro_configs hint"

    - name: Verify | Read captured foreign result file
      become: true
      ansible.builtin.slurp:
        src: /tmp/logrotate_foreign_captured.json
      register: __logrotate_foreign_file

    - name: Verify | Set captured foreign result facts
      ansible.builtin.set_fact:
        __logrotate_foreign_warning_msg: "{{ (__logrotate_foreign_file.content | b64decode | from_json).warning_msg }}"

    - name: Verify | Assert role output for foreign conflicts
      ansible.builtin.assert:
        that:
          - "'foreign-beta' in __logrotate_foreign_warning_msg"
          - "'This role does not manage these file(s)' in __logrotate_foreign_warning_msg"
          - "'Parsed errors: error: foreign-beta' in __logrotate_foreign_warning_msg"
        fail_msg: "Foreign warning role output assertion failed: {{ __logrotate_foreign_warning_msg }}"
        success_msg: "Role correctly issued foreign warning output for unmanaged drop-ins including foreign-beta"
