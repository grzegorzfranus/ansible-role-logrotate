---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Package Installation
# =============================================================================
# This file installs required packages for logrotate management.
#
# Flow:
# 1. Package installation
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Package Installation
# -----------------------------------------------------------------------------
- name: Logrotate | install | Ensure logrotate present
  ansible.builtin.package:
    name: "{{ logrotate_package_name }}"
    state: present
  become: true
  register: __logrotate_package_result
  retries: 3
  delay: 5
  until: __logrotate_package_result is succeeded
  tags:
    - logrotate_setup
    - logrotate_install
