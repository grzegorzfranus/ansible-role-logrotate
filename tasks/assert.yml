---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Assertions
# =============================================================================
# Validates role configuration parameters and preflight requirements.
# Basic type/choice validation is handled by meta/argument_specs.yml.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. General Settings
# -----------------------------------------------------------------------------
# Validates target OS platform support and status file path location.

- name: Logrotate | assert | Validate logrotate_os_support_check_enabled boolean format
  ansible.builtin.assert:
    that:
      - logrotate_os_support_check_enabled is defined
      - logrotate_os_support_check_enabled is boolean
    fail_msg: "logrotate_os_support_check_enabled must be a boolean (true or false)"
    success_msg: "logrotate_os_support_check_enabled validated: {{ logrotate_os_support_check_enabled }}"

- name: Logrotate | assert | Validate target operating system is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] is defined
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] is defined
      - ansible_facts['distribution_major_version'] is defined
      - (ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']) in logrotate_supported_platforms
    fail_msg: >-
      Unsupported operating system:
      {{ ansible_facts['distribution'] | default('unknown') }}
      {{ ansible_facts['distribution_version'] | default('unknown') }}.
      Supported platforms: {{ logrotate_supported_platforms | join(', ') }}.
      To override at your own risk, set logrotate_os_support_check_enabled to a boolean false
      in your playbook or inventory (note: -e logrotate_os_support_check_enabled=false passes
      a string and will be rejected; use -e '{"logrotate_os_support_check_enabled": false}').
    success_msg: >-
      Operating system supported:
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] | default(ansible_facts['distribution_major_version']) }}
  when: logrotate_os_support_check_enabled | bool

- name: Logrotate | assert | Validate logrotate_status_file path format
  ansible.builtin.assert:
    that:
      - logrotate_status_file is defined
      - logrotate_status_file is string
      - logrotate_status_file | length > 0
      - logrotate_status_file is match('^/.+')
    fail_msg: "logrotate_status_file must be an absolute path starting with '/'"
    success_msg: "logrotate_status_file path format validated: {{ logrotate_status_file }}"

# -----------------------------------------------------------------------------
# 2. Main Logrotate Configuration
# -----------------------------------------------------------------------------
# Validates global logrotate octal permissions format.

- name: Logrotate | assert | Validate logrotate_olddir_mode octal permissions format
  ansible.builtin.assert:
    that:
      - logrotate_olddir_mode is defined
      - logrotate_olddir_mode is string
      - logrotate_olddir_mode | length > 0
      - logrotate_olddir_mode is match('^[0-7]{3,4}$')
    fail_msg: "logrotate_olddir_mode must be a valid 3-4 digit octal mode string (e.g. '0755')"
    success_msg: "logrotate_olddir_mode octal format validated: {{ logrotate_olddir_mode }}"

# -----------------------------------------------------------------------------
# 3. Per-Rule Management
# -----------------------------------------------------------------------------
# Validates per-application log rotation rule parameters and options.

- name: Logrotate | assert | Validate logrotate_purge_distro_configs list structure
  ansible.builtin.assert:
    that:
      - logrotate_purge_distro_configs is defined
      - logrotate_purge_distro_configs is sequence
    fail_msg: "logrotate_purge_distro_configs must be a list"
    success_msg: "logrotate_purge_distro_configs list structure validated"

- name: Logrotate | assert | Validate each logrotate_purge_distro_configs entry is a non-empty filename without path separators
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
      - item is not search('/')
    fail_msg: "Every entry in logrotate_purge_distro_configs must be a non-empty drop-in filename string without '/' path separators"
    success_msg: "Drop-in filename '{{ item }}' validated in logrotate_purge_distro_configs"
  loop: "{{ logrotate_purge_distro_configs }}"
  loop_control:
    label: "{{ item }}"

- name: Logrotate | assert | Validate logrotate_rules list structure
  ansible.builtin.assert:
    that:
      - logrotate_rules is defined
      - logrotate_rules is iterable
    fail_msg: "logrotate_rules must be a list"
    success_msg: "logrotate_rules list structure validated"

- name: Logrotate | assert | Validate each rule declares a non-empty name
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | length > 0
    fail_msg: "Every entry in logrotate_rules must declare a non-empty name string"
    success_msg: "Rule '{{ item.name }}' name validated"
  loop: "{{ logrotate_rules }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  when: logrotate_rules | length > 0

- name: Logrotate | assert | Validate rendered rules declare non-empty paths
  ansible.builtin.assert:
    that:
      - item.paths is defined
      - item.paths is iterable
      - item.paths | length > 0
    fail_msg: "Rule '{{ item.name }}' is rendered and must declare a non-empty paths list"
    success_msg: "Rule '{{ item.name }}' paths validated with {{ item.paths | length }} entries"
  loop: "{{ logrotate_rules }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  when:
    - logrotate_rules | length > 0
    - logrotate_state | lower == 'present'
    - item.state | default('present') == 'present'

- name: Logrotate | assert | Validate olddir path in rule options when present
  ansible.builtin.assert:
    that:
      - item.options.olddir is string
      - item.options.olddir | length > 0
      - item.options.olddir is match('^/.+')
    fail_msg: "olddir option in rule '{{ item.name }}' must be an absolute path starting with '/'"
    success_msg: "olddir path format validated in rule '{{ item.name }}': {{ item.options.olddir }}"
  loop: "{{ logrotate_rules }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  when:
    - logrotate_rules | length > 0
    - item.options is defined
    - item.options.olddir is defined

# -----------------------------------------------------------------------------
# 4. Role Lifecycle
# -----------------------------------------------------------------------------
# Validates lifecycle state, package removal opt-in, and verification error handling.

- name: Logrotate | assert | Validate logrotate_state value
  ansible.builtin.assert:
    that:
      - logrotate_state is defined
      - logrotate_state is string
      - logrotate_state | length > 0
      - logrotate_state | lower in ['present', 'absent']
    fail_msg: "logrotate_state must be one of: 'present', 'absent'"
    success_msg: "logrotate_state validated: {{ logrotate_state }}"

- name: Logrotate | assert | Validate logrotate_remove_package boolean format
  ansible.builtin.assert:
    that:
      - logrotate_remove_package is defined
      - logrotate_remove_package is boolean
    fail_msg: "logrotate_remove_package must be a boolean (true or false)"
    success_msg: "logrotate_remove_package validated: {{ logrotate_remove_package }}"

- name: Logrotate | assert | Validate logrotate_fail_on_verify_error boolean format
  ansible.builtin.assert:
    that:
      - logrotate_fail_on_verify_error is defined
      - logrotate_fail_on_verify_error is boolean
    fail_msg: "logrotate_fail_on_verify_error must be a boolean (true or false)"
    success_msg: "logrotate_fail_on_verify_error validated: {{ logrotate_fail_on_verify_error }}"

# -----------------------------------------------------------------------------
# 5. Internal Constants
# -----------------------------------------------------------------------------
# Validates package name, system configuration directory, and supported platforms constants.

- name: Logrotate | assert | Validate internal configuration path constants
  ansible.builtin.assert:
    that:
      - logrotate_package_name is defined
      - logrotate_package_name is string
      - logrotate_package_name | length > 0
      - logrotate_d_directory_path is defined
      - logrotate_d_directory_path is string
      - logrotate_d_directory_path | length > 0
      - logrotate_d_directory_path is match('^/.+')
      - logrotate_main_config_path is defined
      - logrotate_main_config_path is string
      - logrotate_main_config_path | length > 0
      - logrotate_main_config_path is match('^/.+')
    fail_msg: "Package name must be string, and configuration paths must be non-empty absolute paths"
    success_msg: "Internal constants validated: package={{ logrotate_package_name }}, d_dir={{ logrotate_d_directory_path }}, main={{ logrotate_main_config_path }}"

- name: Logrotate | assert | Validate logrotate_supported_platforms constant
  ansible.builtin.assert:
    that:
      - logrotate_supported_platforms is defined
      - logrotate_supported_platforms is iterable
      - logrotate_supported_platforms | length > 0
    fail_msg: "logrotate_supported_platforms must be a non-empty list of '<Distribution>-<major_version>' strings"
    success_msg: "logrotate_supported_platforms validated with {{ logrotate_supported_platforms | length }} entries"
