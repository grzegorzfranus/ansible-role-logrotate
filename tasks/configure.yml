---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Configuration
# =============================================================================
# Manages the main /etc/logrotate.conf configuration file.
# =============================================================================

# Note: validate is omitted here because logrotate.conf includes /etc/logrotate.d/*.
# Running logrotate -d at this stage parses the full unharmonized drop-in tree before rules
# are applied. Full verification is performed in tasks/verify.yml after applying rules.
- name: Logrotate | configure | Render main /etc/logrotate.conf
  ansible.builtin.template:
    src: "logrotate.conf.j2"
    dest: "{{ logrotate_main_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
