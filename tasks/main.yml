---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Main Entrypoint
# =============================================================================
# Main task entrypoint orchestrating role execution workflow.
# Flow: include_vars → assert → [present: install → configure → purge_distro → rules → verify | absent: remove]
# =============================================================================

- name: Logrotate | include_vars | Gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
        - "main.yml"
      paths:
        - "{{ role_path }}/vars"
  tags:
    - always
    - logrotate_setup
    - logrotate_init

- name: Logrotate | assert | Validate role variables and requirements
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always
    - logrotate_validate

- name: "Logrotate | main | Execute lifecycle tasks for state: present"
  when: logrotate_state | lower == 'present'
  block:
    - name: Logrotate | install | Install dependencies
      ansible.builtin.import_tasks: install.yml
      tags:
        - logrotate_setup
        - logrotate_install

    - name: Logrotate | configure | Configure main logrotate.conf
      ansible.builtin.import_tasks: configure.yml
      when: logrotate_manage_main_conf | bool
      tags:
        - logrotate_setup
        - logrotate_configure

    - name: Logrotate | purge_distro | Remove superseded distribution drop-in configurations
      ansible.builtin.import_tasks: purge_distro.yml
      when: logrotate_purge_distro_configs | length > 0
      tags:
        - logrotate_setup
        - logrotate_configure
        - logrotate_purge

    - name: Logrotate | rules | Apply present rules
      ansible.builtin.include_tasks:
        file: rules.yml
      args:
        apply:
          tags:
            - logrotate_setup
            - logrotate_configure
            - logrotate_rules
      vars:
        rule: "{{ item }}"
      loop: "{{ (logrotate_rules | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list)
               + (logrotate_rules | rejectattr('state', 'defined') | list) }}"
      loop_control:
        label: "{{ item.name }}"
      when: logrotate_rules | length > 0
      tags:
        - logrotate_setup
        - logrotate_configure
        - logrotate_rules

    - name: Logrotate | rules | Remove absent rules
      ansible.builtin.include_tasks:
        file: rules.yml
      args:
        apply:
          tags:
            - logrotate_setup
            - logrotate_configure
            - logrotate_rules
      vars:
        rule: "{{ item }}"
      loop: "{{ logrotate_rules | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: logrotate_rules | length > 0
      tags:
        - logrotate_setup
        - logrotate_configure
        - logrotate_rules

    - name: Logrotate | verify | Verify configuration (dry-run)
      ansible.builtin.import_tasks: verify.yml
      tags:
        - logrotate_verify

- name: "Logrotate | main | Execute removal tasks for state: absent"
  ansible.builtin.import_tasks: remove.yml
  when: logrotate_state | lower == 'absent'
  tags:
    - logrotate_remove
