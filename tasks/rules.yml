---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Per-rule Management
# =============================================================================
# Manages per-application log rotation rule files under /etc/logrotate.d.
# =============================================================================

- name: Logrotate | rules | Stat olddir (when specified)
  ansible.builtin.stat:
    path: "{{ rule.options.olddir }}"
  register: __logrotate_rule_olddir_stat
  when:
    - logrotate_olddir_create_enabled | bool
    - rule.options is defined
    - rule.options.olddir is defined

- name: Logrotate | rules | Create olddir when missing
  ansible.builtin.file:
    path: "{{ rule.options.olddir }}"
    state: directory
    owner: "{{ logrotate_olddir_owner }}"
    group: "{{ logrotate_olddir_group }}"
    mode: "{{ logrotate_olddir_mode }}"
  when:
    - logrotate_olddir_create_enabled | bool
    - rule.options is defined
    - rule.options.olddir is defined
    - __logrotate_rule_olddir_stat.stat is defined
    - not (__logrotate_rule_olddir_stat.stat.exists | default(false))

- name: Logrotate | rules | Render rule (present)
  ansible.builtin.template:
    src: "logrotate_rule.j2"
    dest: "{{ logrotate_d_directory_path }}/{{ rule.name }}"
    owner: root
    group: root
    mode: "0644"
    validate: "logrotate -d -s {{ logrotate_status_file }} %s"
    backup: true
  when: rule.state | default('present') == 'present'

- name: Logrotate | rules | Remove rule (absent)
  ansible.builtin.file:
    path: "{{ logrotate_d_directory_path }}/{{ rule.name }}"
    state: absent
  when: rule.state | default('present') == 'absent'
