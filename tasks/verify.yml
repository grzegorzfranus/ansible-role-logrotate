---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Configuration Verification
# =============================================================================
# Performs dry-run verification of logrotate configuration files.
# =============================================================================

# Justification: Use command module because logrotate syntax and configuration integrity
# verification requires running the native 'logrotate -d' utility, which has no native Ansible module.
- name: Logrotate | verify | Verify logrotate configuration parses successfully
  ansible.builtin.command: >-
    logrotate -d -s {{ logrotate_status_file }} {{ logrotate_main_config_path }}
  register: __logrotate_verify
  changed_when: false
  failed_when: false

- name: Logrotate | verify | Evaluate dry-run verification results
  vars:
    __logrotate_verify_errors: >-
      {{ (__logrotate_verify.stderr | default('')).splitlines()
         | select('match', '^error:') | list }}
    __logrotate_managed_files: >-
      {{ (logrotate_rules | default([]) | map(attribute='name') | list)
         + [(logrotate_main_config_path | default('/etc/logrotate.conf')) | basename] }}
    __logrotate_verify_is_permission_error: >-
      {{ (__logrotate_verify_errors | join(' '))
         is search('switching euid|Permission denied') }}
    __logrotate_verify_annotated_errors: >-
      {% set annotated = [] %}
      {% for err in __logrotate_verify_errors %}
        {% set m1 = err | regex_findall('^error: ([^ :]+):[0-9]+ ') %}
        {% set m2 = err | regex_findall('^error: found error in file ([^,]+),') %}
        {% set raw = (m1 | first) if (m1 | length > 0) else ((m2 | first) if (m2 | length > 0) else '') %}
        {% set owner = raw | basename %}
        {% set _ = annotated.append({'line': err, 'owner': owner, 'is_own': (owner == '' or owner in __logrotate_managed_files)}) %}
      {% endfor %}
      {{ annotated | to_json }}
    __logrotate_own_errors_list: >-
      {{ (__logrotate_verify_annotated_errors | from_json)
         | selectattr('is_own', 'equalto', true) | map(attribute='line') | list }}
    __logrotate_foreign_errors_list: >-
      {{ (__logrotate_verify_annotated_errors | from_json)
         | selectattr('is_own', 'equalto', false) | map(attribute='line') | list }}
    __logrotate_foreign_files_list: >-
      {{ (__logrotate_verify_annotated_errors | from_json)
         | selectattr('is_own', 'equalto', false) | map(attribute='owner') | unique | list }}
  block:
    - name: Logrotate | verify | Assert logrotate dry-run verification succeeded
      ansible.builtin.assert:
        that:
          - __logrotate_verify.rc == 0
        fail_msg: >-
          logrotate verification failed!
          Parsed errors: {{ __logrotate_own_errors_list | join('; ') if (__logrotate_own_errors_list | length > 0) else 'None extracted' }}.
          {{ 'Hint: Insufficient privileges — the dry-run must run as root. '
             ~ 'Ensure the role or playbook elevates with become.'
             if (__logrotate_verify_is_permission_error | bool)
             else "Note: Configuration conflicts may originate from unmanaged distribution drop-ins in /etc/logrotate.d/. "
                  ~ "Consider adding conflicting drop-in names (e.g. 'postgresql-common') to logrotate_purge_distro_configs." }}
          Full stderr output:
          {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}
        success_msg: "logrotate configuration verified successfully"
      when:
        - not ansible_check_mode
        - logrotate_fail_on_verify_error | bool
        - (__logrotate_own_errors_list | length > 0) or (__logrotate_foreign_errors_list | length == 0)

    - name: Logrotate | verify | Report non-fatal logrotate dry-run failure
      ansible.builtin.debug:
        msg: >-
          WARNING: logrotate dry-run verification reported errors, but logrotate_fail_on_verify_error is set to false.
          Parsed errors: {{ __logrotate_own_errors_list | join('; ') if (__logrotate_own_errors_list | length > 0) else 'None extracted' }}.
          {{ 'Hint: Insufficient privileges — the dry-run must run as root. '
             ~ 'Ensure the role or playbook elevates with become.'
             if (__logrotate_verify_is_permission_error | bool)
             else "Note: Configuration conflicts may originate from unmanaged distribution drop-ins in /etc/logrotate.d/. "
                  ~ "Consider adding conflicting drop-in names to logrotate_purge_distro_configs." }}
          Full stderr output:
          {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}
      when:
        - not ansible_check_mode
        - not (logrotate_fail_on_verify_error | bool)
        - __logrotate_verify.rc != 0
        - (__logrotate_own_errors_list | length > 0) or (__logrotate_foreign_errors_list | length == 0)

    - name: Logrotate | verify | Fail on unmanaged foreign drop-in dry-run verification errors
      ansible.builtin.fail:
        msg: >-
          logrotate verification failed due to unmanaged foreign drop-in file(s): {{ __logrotate_foreign_files_list | join(', ') }}.
          This role does not manage these file(s). logrotate will skip the offending file(s) at rotation time.
          Consider adding conflicting drop-in names to logrotate_purge_distro_configs if you want this role to remove them.
          Parsed errors: {{ __logrotate_foreign_errors_list | join('; ') }}.
          Full stderr output:
          {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}
      when:
        - not ansible_check_mode
        - logrotate_fail_on_foreign_verify_error | bool
        - __logrotate_verify.rc != 0
        - __logrotate_own_errors_list | length == 0
        - __logrotate_foreign_errors_list | length > 0

    - name: Logrotate | verify | Report foreign logrotate dry-run verification warnings
      ansible.builtin.debug:
        msg: >-
          WARNING: logrotate dry-run verification reported errors in unmanaged drop-in file(s): {{ __logrotate_foreign_files_list | join(', ') }}.
          This role does not manage these file(s). logrotate will skip the offending file(s) at rotation time.
          Consider adding conflicting drop-in names to logrotate_purge_distro_configs if you want this role to remove them.
          Parsed errors: {{ __logrotate_foreign_errors_list | join('; ') }}.
          Full stderr output:
          {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}
      register: __logrotate_foreign_warning
      when:
        - not ansible_check_mode
        - not (logrotate_fail_on_foreign_verify_error | bool)
        - __logrotate_verify.rc != 0
        - __logrotate_own_errors_list | length == 0
        - __logrotate_foreign_errors_list | length > 0
