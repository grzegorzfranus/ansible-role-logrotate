---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Configuration Verification
# =============================================================================
# This file runs a dry-run of logrotate to confirm configuration parses correctly.
#
# Flow:
# 1. Dry-run configuration parse check
# 2. Assert dry-run verification succeeded
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Dry-run Configuration Parse Check
# -----------------------------------------------------------------------------
# Justification: Use command module because logrotate syntax and configuration integrity
# verification requires running the native 'logrotate -d' utility, which has no native Ansible module.
- name: Logrotate | verify | Verify logrotate configuration parses successfully
  ansible.builtin.command: >-
    logrotate -d -s {{ logrotate_status_file }} {{ logrotate_main_config_path }}
  register: __logrotate_verify
  changed_when: false
  failed_when: false
  tags:
    - logrotate_verify

- name: Logrotate | verify | Assert logrotate dry-run verification succeeded
  ansible.builtin.assert:
    that:
      - __logrotate_verify.rc == 0
    fail_msg: "logrotate verification failed: {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}"
    success_msg: "logrotate configuration verified successfully"
  tags:
    - logrotate_verify
