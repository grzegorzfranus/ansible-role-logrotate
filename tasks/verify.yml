---
# =============================================================================
# Ansible Role: Logrotate - Tasks: Configuration Verification
# =============================================================================
# Performs dry-run verification of logrotate configuration files.
# =============================================================================

# Justification: Use command module because logrotate syntax and configuration integrity
# verification requires running the native 'logrotate -d' utility, which has no native Ansible module.
- name: Logrotate | verify | Verify logrotate configuration parses successfully
  ansible.builtin.command: >-
    logrotate -d -s {{ logrotate_status_file }} {{ logrotate_main_config_path }}
  register: __logrotate_verify
  changed_when: false
  failed_when: false

- name: Logrotate | verify | Assert logrotate dry-run verification succeeded
  ansible.builtin.assert:
    that:
      - __logrotate_verify.rc == 0
    fail_msg: >-
      logrotate verification failed!
      Parsed errors: {{ __logrotate_verify_errors | join('; ') if (__logrotate_verify_errors | length > 0) else 'None extracted' }}.
      Note: Configuration conflicts may originate from unmanaged distribution drop-ins in /etc/logrotate.d/.
      Consider adding conflicting drop-in names (e.g. 'postgresql-common') to logrotate_purge_distro_configs.
      Full stderr output:
      {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}
    success_msg: "logrotate configuration verified successfully"
  vars:
    __logrotate_verify_errors: "{{ __logrotate_verify.stderr | default('') | split('\n')
                                   | select('match', '^error:') | list }}"
  when:
    - not ansible_check_mode
    - logrotate_fail_on_verify_error | bool

- name: Logrotate | verify | Report non-fatal logrotate dry-run failure
  ansible.builtin.debug:
    msg: >-
      WARNING: logrotate dry-run verification reported errors, but logrotate_fail_on_verify_error is set to false.
      Parsed errors: {{ __logrotate_verify_errors | join('; ') if (__logrotate_verify_errors | length > 0) else 'None extracted' }}.
      Note: Configuration conflicts may originate from unmanaged distribution drop-ins in /etc/logrotate.d/.
      Consider adding conflicting drop-in names to logrotate_purge_distro_configs.
      Full stderr output:
      {{ __logrotate_verify.stderr | default(__logrotate_verify.stdout) }}
  vars:
    __logrotate_verify_errors: "{{ __logrotate_verify.stderr | default('') | split('\n')
                                   | select('match', '^error:') | list }}"
  when:
    - not ansible_check_mode
    - not (logrotate_fail_on_verify_error | bool)
    - __logrotate_verify.rc != 0
